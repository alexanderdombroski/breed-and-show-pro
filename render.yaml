services:
  - type: web
    name: breed-and-show-pro
    runtime: node
    plan: free

    buildCommand: pnpm install
    startCommand: pnpm run -F backend start
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    buildFilter:
      ignoredPaths:
        - packages/breeder/**
        - packages/exhibitor/**
